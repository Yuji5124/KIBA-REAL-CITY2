<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木場公園 Phase 2H · Vegetation</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="viewport"><section id="hud"><strong>木場公園 · Phase 2H 橋梁移動実験</strong><span id="status">地形・植生を読込中…</span><span id="perf"></span><span id="vegetationStat"></span><span id="bridgeStatus">G6.2読込中 · 見た目専用 · 橋面高さ未照合</span><div class="buttons"><button id="viewRobot">ロボット視点</button><button id="viewAbove">上空視点</button><button id="viewBridge">橋梁地上視点</button><button id="viewSide">橋梁側面</button><button id="test">24m移動テスト</button><button id="saveShot">Phase 2H PNG保存</button></div><span id="viewStatus">上空視点</span><label><input id="debug" type="checkbox"> 移動判定レイヤーを表示</label><label><input id="deckToggle" type="checkbox" checked> 推定橋面候補を表示（通行不可）</label><small>操作: WASD / 矢印キー · マウスドラッグで上空視点を移動 · ホイールで拡大縮小</small><output id="testResult">移動テスト未実施</output><fieldset id="trialControls"><legend>橋梁実験（推定面のみ／通常モード通行不可）</legend><label><input id="trialMode" type="checkbox">実験モード</label><select id="trialRun"><option value="0">Run A・68.0m</option><option value="1">Run B・64.9m</option></select><button id="trialReset">実験位置</button><button id="trialForward">前進・端部まで</button><button id="trialReverse">後退・端部まで</button><button id="trialStop">停止</button><output id="trialResult">通常モード: 橋梁13 runの既存判定を使用</output></fieldset></section><section id="legend"><span><i class="mapped"></i>OSM位置</span><span><i class="estimated"></i>推定配置</span><span><i class="grass"></i>草地</span><span><i class="estimated"></i>推定橋面</span><span>下面・欄干：寸法推定／衝突なし</span><span><i class="walk"></i>移動可能</span><span><i class="review"></i>要確認</span><span><i class="blocked"></i>通行不可</span></section><div id="error"></div></main><script type="module" src="./app.js"></script></body>
</html>
