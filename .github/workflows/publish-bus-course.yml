name: Publish bus course

on:
  push:
    branches:
      - main
    paths:
      - "build-phaseD11/**"
      - ".github/workflows/publish-bus-course.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload bus course site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-phaseD11

      - name: Deploy bus course
        id: deployment
        uses: actions/deploy-pages@v4
