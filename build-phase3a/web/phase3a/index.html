<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIBA PARK · Phase 3A</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="viewport"><section id="hud"><strong>木場公園 · Phase 3A ロボットアクション</strong><span id="status">地形・植生を読込中…</span><span id="perf"></span><span id="vegetationStat"></span><span id="bridgeStatus">G6.2読込中 · 見た目専用 · 橋面高さ未照合</span><div class="buttons"><button id="viewRobot">ゲームカメラ</button><button id="viewAbove">上空視点</button><button id="test">既存24m移動テスト</button><button id="attack">攻撃（Space / J）</button><button id="restart">再開（R）</button><button id="saveShot">画面を保存</button></div><span id="viewStatus">上空視点</span><label><input id="debug" type="checkbox"> DEV衝突・移動判定を表示</label><label><input id="deckToggle" type="checkbox" checked> 推定橋梁表示（通行不可）</label><small>操作: WASDで移動 · Space / Jで攻撃 · 園路上で敵1体を撃破</small><output id="gameStatus">戦闘エリアを準備中…</output><div id="health"><span>PLAYER</span><meter id="playerHp" min="0" max="100" value="100"></meter><span id="playerHpText">100 HP</span><span>ENEMY</span><meter id="enemyHp" min="0" max="100" value="100"></meter><span id="enemyHpText">100 HP</span></div><output id="testResult">移動テスト未実施</output></section><section id="legend"><span><i class="mapped"></i>OSM位置</span><span><i class="estimated"></i>推定配置</span><span><i class="grass"></i>草地</span><span><i class="estimated"></i>推定橋面</span><span>OSM平面トレース：高さなし</span><span>下面・欄干：寸法推定／衝突なし</span><span><i class="walk"></i>移動可能</span><span><i class="review"></i>要確認</span><span><i class="blocked"></i>通行不可</span></section><div id="error"></div></main><script type="module" src="./app.js"></script></body>
</html>
